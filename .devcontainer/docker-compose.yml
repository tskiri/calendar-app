# Dev ContainerでVS Codeからコンテナに接続できるようにする。
services:
  app:
    # Java 21の開発ツールが全部入った公式イメージ
    image: mcr.microsoft.com/devcontainers/java:21
    # コンテナが終了しないように待機させるおまじない
    command: sleep infinity
    volumes:
      # プロジェクト全体をコンテナ内の /workspace に同期する
      - ..:/workspace:cached
    environment:
      # コンテナ内からDBへ繋ぐ設定
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/calendar_app
    depends_on:
      - db

  db:
    image: postgres:15
    container_name: devcontainer-postgres
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: calendar_app
      POSTGRES_USER: calendar_user
      POSTGRES_PASSWORD: calendar_pass
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data: